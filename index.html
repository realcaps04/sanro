      content="SANRO Fibre Glass Industries manufactures premium fibre interior doors, custom fibre solutions and professional waterproofing for residential and commercial spaces."
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <title>Sanro | Premium Interior Fibre Doors</title>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister())
        })
      }
      if (window.caches) {
        caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)))
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
